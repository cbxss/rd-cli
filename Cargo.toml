[package]
name = "rd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Real-Debrid from your command line"
license = "MIT"
repository = "https://github.com/cbxss/rd-cli"
homepage = "https://github.com/cbxss/rd-cli"
readme = "README.md"
keywords = ["real-debrid", "cli", "download", "torrent"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
directories = "6"
toml = "0.8"
indicatif = "0.17"
comfy-table = "7"
futures-util = "0.3"
rpassword = "7"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
