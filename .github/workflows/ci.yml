name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The Docker suite is run by hand; this only keeps it compiling.
      - name: Check container tests
        if: runner.os == 'Linux'
        run: cargo clippy --tests --features container-tests --locked -- -D warnings
