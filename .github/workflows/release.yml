name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: rd
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: rd
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: rd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: rd.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" rd
          tar -czf "dist/rd-${{ matrix.target }}.tar.gz" rd

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "rd.exe"
          Compress-Archive -Force -Path "rd.exe" -DestinationPath "dist/rd-${{ matrix.target }}.zip"

      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
